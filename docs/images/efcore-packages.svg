<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="EF Core 套件的分層：SqlServer 套件帶入 Relational、EF Core 本體和 SqlClient，負責執行時；Design 套件給 dotnet ef 工具在開發時產生 Migration 用">
<style>
  svg {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --soft: #f6f8fa; --card: #ffffff;
    --you: #fff1e5; --you-b: #bc4c00; --app: #dcfce7; --app-b: #16a34a; --orm: #ffe4e6; --orm-b: #e11d48; --rel: #fdf2f8; --ado: #ede9fe; --ado-b: #7c3aed;
    --tool: #ddf4ff; --tool-b: #0969da; --run: #f6f8fa; --dev: #f0f7ff;
    font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --soft: #151b23; --card: #151b23;
      --you: #3d2410; --you-b: #ffa657; --app: #12261b; --app-b: #3fb950; --orm: #3b1520; --orm-b: #f472b6; --rel: #2a1420; --ado: #231a3d; --ado-b: #a78bfa;
      --tool: #0c2d4a; --tool-b: #58a6ff; --run: #151b23; --dev: #0d1a2b;
    }
  }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 13px; }
  .h { font-size: 15px; font-weight: 800; }
  .b { white-space: pre; font-size: 13px; font-weight: 700; font-family: "Cascadia Code", Consolas, "Segoe UI", monospace; }
  .xs { font-size: 11.5px; fill: var(--muted); }
  .zone-run { fill: var(--run); stroke: var(--border); stroke-width: 1.5; }
  .zone-dev { fill: var(--dev); stroke: var(--tool-b); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .you { fill: var(--you); stroke: var(--you-b); stroke-width: 2.5; }
  .app { fill: var(--app); stroke: var(--app-b); stroke-width: 2; }
  .orm { fill: var(--orm); stroke: var(--orm-b); stroke-width: 2; }
  .rel { fill: var(--rel); stroke: var(--orm-b); stroke-width: 1.5; }
  .ado { fill: var(--ado); stroke: var(--ado-b); stroke-width: 2; }
  .tool { fill: var(--tool); stroke: var(--tool-b); stroke-width: 2; }
  .arr { fill: none; stroke: var(--muted); stroke-width: 2; }
  .f-muted { fill: var(--muted); }
  .tag { font-size: 11px; font-weight: 800; fill: #ffffff; }
  .tag-you { fill: var(--you-b); }
  .t-you { fill: var(--you-b); font-weight: 700; font-size: 12px; }
  .t-run { fill: var(--app-b); font-weight: 800; } .t-dev { fill: var(--tool-b); font-weight: 800; }
</style>
<defs>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="f-muted" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="520" rx="12"/>

<!-- 執行時 -->
<rect class="zone-run" x="20" y="20" width="560" height="480" rx="12"/>
<text class="h t-run" x="40" y="48">執行時：API 跑起來要用的</text>

<rect class="app" x="40" y="66" width="250" height="44" rx="8"/>
<text class="b" x="56" y="93">BlogApi（你的程式）</text>

<rect class="you" x="40" y="132" width="520" height="70" rx="9"/>
<rect class="tag-you" x="436" y="140" width="112" height="20" rx="10"/><text class="tag" x="492" y="154" text-anchor="middle">✋ 你安裝的</text>
<text class="b" x="56" y="158">Microsoft.EntityFrameworkCore.SqlServer</text>
<text class="xs" x="56" y="178">「SQL Server 專用的翻譯器」：TOP(1)、[方括號]、OUTPUT INSERTED</text>
<text class="xs" x="56" y="194">提供 UseSqlServer()。換資料庫就只換這一個（PostgreSQL、SQLite…）</text>

<rect class="rel" x="70" y="226" width="490" height="62" rx="9"/>
<text class="b" x="86" y="250">Microsoft.EntityFrameworkCore.Relational</text>
<text class="xs" x="86" y="270">所有「關聯式資料庫」共用：產生 SQL 的基礎、執行 Migration</text>
<text class="xs" x="420" y="250">自動帶進來</text>

<rect class="orm" x="100" y="312" width="460" height="62" rx="9"/>
<text class="b" x="116" y="336">Microsoft.EntityFrameworkCore</text>
<text class="xs" x="116" y="356">EF Core 本體：DbContext、DbSet、LINQ、Change Tracking</text>
<text class="xs" x="420" y="336">自動帶進來</text>

<rect class="ado" x="70" y="398" width="490" height="62" rx="9"/>
<text class="b" x="86" y="422">Microsoft.Data.SqlClient</text>
<text class="xs" x="86" y="442">ADO.NET：真正開連線、把 SQL 送到 SQL Server（2-1 那個）</text>
<text class="xs" x="420" y="422">自動帶進來</text>

<path class="arr" d="M60,110 V128" marker-end="url(#am)"/>
<path class="arr" d="M52,202 V257 H66" marker-end="url(#am)"/>
<path class="arr" d="M80,288 V343 H96" marker-end="url(#am)"/>
<path class="arr" d="M52,257 V429 H66" marker-end="url(#am)"/>
<text class="xs" x="40" y="486">箭頭：「需要」。只要裝最上面那一個，下面三個 NuGet 會自動一起裝</text>

<!-- 開發時 -->
<rect class="zone-dev" x="600" y="20" width="380" height="480" rx="12"/>
<text class="h t-dev" x="620" y="48">開發時：產生 Migration 要用的</text>

<rect class="tool" x="620" y="66" width="340" height="70" rx="9"/>
<text class="b" x="636" y="92">dotnet-ef（工具，不是套件）</text>
<text class="xs" x="636" y="112">全域安裝一次，提供指令：</text>
<text class="xs" x="636" y="128">dotnet ef migrations add / database update</text>

<path class="arr" d="M790,136 V172" marker-end="url(#am)"/>
<text class="xs" x="800" y="160">執行時會 build 並載入你的專案</text>

<rect class="you" x="620" y="176" width="340" height="146" rx="9"/>
<text class="b" x="636" y="200">Microsoft.EntityFrameworkCore</text>
<text class="b" x="636" y="218">  .Design</text>
<text class="xs" x="636" y="242">工具需要的「設計階段」功能：</text>
<text class="xs" x="636" y="260">找到你的 DbContext、比對模型差異、</text>
<text class="xs" x="636" y="278">產生 Migrations\*.cs 程式碼</text>
<text class="xs" x="636" y="300">帶進 Roslyn、Humanizer 等產生程式碼用的套件</text>
<rect class="tag-you" x="836" y="227" width="112" height="20" rx="10"/><text class="tag" x="892" y="241" text-anchor="middle">✋ 你安裝的</text>

<path class="arr" d="M790,322 V352" marker-end="url(#am)"/>

<rect class="app" x="620" y="356" width="340" height="56" rx="9"/>
<text class="b" x="636" y="380">Migrations\xxxx_InitialCreate.cs</text>
<text class="xs" x="636" y="400">產生出來的檔案，要 commit</text>

<text class="xs" x="620" y="436">沒裝 Design → dotnet ef 會報錯：</text>
<text class="xs" x="620" y="452">Your startup project doesn't reference</text>
<text class="xs" x="620" y="468">Microsoft.EntityFrameworkCore.Design</text>
<text class="xs" x="620" y="486">csproj 裡標 PrivateAssets=all：不會傳給參考這個專案的其他專案</text>
</svg>
