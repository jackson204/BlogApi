<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="一個方法簽章的五個部分：存取修飾與 static、回傳型別、名稱、參數、選擇性參數，以 public static string Repeat(string text, int count = 2) 為例">
<style>
  svg {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --card: #ffffff; --border: #d1d9e0;
    --c1: #0969da; --c2: #16a34a; --c3: #7c3aed; --c4: #e11d48; --c5: #b45309;
    font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --card: #151b23; --border: #3d444d;
      --c1: #58a6ff; --c2: #3fb950; --c3: #a78bfa; --c4: #f472b6; --c5: #f0b429;
    }
  }
  .bg { fill: var(--bg); }
  .panel { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
  text { fill: var(--fg); font-size: 14px; }
  .h { font-size: 17px; font-weight: 800; }
  .xs { font-size: 12px; fill: var(--muted); }
  .code { font-size: 18px; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-variant-ligatures: none; white-space: pre; }
  .num { font-size: 13px; font-weight: 800; fill: #fff; }
  .lbl { font-size: 14px; }
  .lbl tspan.n { font-weight: 800; }
  .bar { stroke-width: 5; stroke-linecap: round; }
  .b1 { stroke: var(--c1); } .b2 { stroke: var(--c2); } .b3 { stroke: var(--c3); } .b4 { stroke: var(--c4); } .b5 { stroke: var(--c5); }
  .d1 { fill: var(--c1); } .d2 { fill: var(--c2); } .d3 { fill: var(--c3); } .d4 { fill: var(--c4); } .d5 { fill: var(--c5); }
</style>
<rect class="bg" x="0" y="0" width="1000" height="330" rx="12"/>
<rect class="panel" x="20" y="20" width="960" height="290" rx="12"/>
<text class="h" x="40" y="54">一個方法簽章的五個部分</text>
<text class="xs" x="40" y="76">簽章 = 怎麼呼叫它、它回什麼。大括號裡的本體不算</text>

<!-- 程式碼：每一段用 textLength 固定寬度，底下的色條才對得準（18px 等寬字，每字 10.8px） -->
<text class="code" x="60" y="124" textLength="151.2" lengthAdjust="spacingAndGlyphs">public static </text>
<text class="code" x="211.2" y="124" textLength="75.6" lengthAdjust="spacingAndGlyphs">string </text>
<text class="code" x="286.8" y="124" textLength="64.8" lengthAdjust="spacingAndGlyphs">Repeat</text>
<text class="code" x="351.6" y="124" textLength="248.4" lengthAdjust="spacingAndGlyphs">(string text, int count</text>
<text class="code" x="600" y="124" textLength="54" lengthAdjust="spacingAndGlyphs"> = 2)</text>

<!-- 色條 -->
<line class="bar b1" x1="62" y1="136" x2="198" y2="136"/>
<line class="bar b2" x1="213" y1="136" x2="276" y2="136"/>
<line class="bar b3" x1="289" y1="136" x2="349" y2="136"/>
<line class="bar b4" x1="362" y1="136" x2="598" y2="136"/>
<line class="bar b5" x1="611" y1="136" x2="652" y2="136"/>

<!-- 編號 -->
<circle class="d1" cx="130" cy="158" r="11"/><text class="num" x="130" y="163" text-anchor="middle">1</text>
<circle class="d2" cx="244" cy="158" r="11"/><text class="num" x="244" y="163" text-anchor="middle">2</text>
<circle class="d3" cx="319" cy="158" r="11"/><text class="num" x="319" y="163" text-anchor="middle">3</text>
<circle class="d4" cx="480" cy="158" r="11"/><text class="num" x="480" y="163" text-anchor="middle">4</text>
<circle class="d5" cx="631" cy="158" r="11"/><text class="num" x="631" y="163" text-anchor="middle">5</text>

<!-- 說明 -->
<circle class="d1" cx="52" cy="198" r="9"/><text class="num" x="52" y="202" text-anchor="middle" style="font-size:11px">1</text>
<text class="lbl" x="70" y="203"><tspan class="n">存取修飾與 static</tspan>　public 誰都能呼叫；static 表示不用 new 物件、直接用類別名稱呼叫</text>
<circle class="d2" cx="52" cy="226" r="9"/><text class="num" x="52" y="230" text-anchor="middle" style="font-size:11px">2</text>
<text class="lbl" x="70" y="231"><tspan class="n">回傳型別</tspan>　呼叫完拿到什麼；void 就是不回傳</text>
<circle class="d3" cx="52" cy="254" r="9"/><text class="num" x="52" y="258" text-anchor="middle" style="font-size:11px">3</text>
<text class="lbl" x="70" y="259"><tspan class="n">名稱</tspan>　呼叫時寫的字</text>
<circle class="d4" cx="52" cy="282" r="9"/><text class="num" x="52" y="286" text-anchor="middle" style="font-size:11px">4</text>
<text class="lbl" x="70" y="287"><tspan class="n">參數</tspan>　每個是「型別 名稱」，呼叫時照順序給值</text>
<circle class="d5" cx="640" cy="282" r="9"/><text class="num" x="640" y="286" text-anchor="middle" style="font-size:11px">5</text>
<text class="lbl" x="658" y="287"><tspan class="n">選擇性參數</tspan>　有預設值，呼叫時可以不給</text>
</svg>
