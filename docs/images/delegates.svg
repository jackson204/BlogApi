<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Action 和 Func 的差別：Action 收參數不回傳；Func 最後一個型別是回傳值，Func&lt;int, int, int&gt; 收兩個 int 回傳 int，Func&lt;Post, bool&gt; 收一個 Post 回傳 bool">
<style>
  svg {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --card: #ffffff;
    --in: #ddf4ff; --in-b: #0969da; --out: #dcfce7; --out-b: #16a34a; --fn: #ede9fe; --fn-b: #7c3aed; --none: #f6f8fa;
    font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --card: #151b23;
      --in: #0c2d4a; --in-b: #58a6ff; --out: #12261b; --out-b: #3fb950; --fn: #231a3d; --fn-b: #a78bfa; --none: #151b23;
    }
  }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 13px; }
  .h { font-size: 17px; font-weight: 800; }
  .b { font-size: 13.5px; font-weight: 700; }
  .xs { font-size: 11.5px; fill: var(--muted); }
  .code { font-size: 13px; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-variant-ligatures: none; }
  .codem { font-size: 12px; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-variant-ligatures: none; fill: var(--muted); }
  .codel { font-size: 12.5px; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-variant-ligatures: none; fill: var(--fg); font-weight: 700; }
  .in { fill: var(--in); stroke: var(--in-b); stroke-width: 2; }
  .out { fill: var(--out); stroke: var(--out-b); stroke-width: 2; }
  .fn { fill: var(--fn); stroke: var(--fn-b); stroke-width: 2; }
  .none { fill: var(--none); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .panel { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
  .arr { fill: none; stroke: var(--muted); stroke-width: 2; }
  .f-muted { fill: var(--muted); }
  .t-fn { fill: var(--fn-b); font-weight: 700; }
</style>
<defs>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="f-muted" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="420" rx="12"/>

<!-- Action -->
<rect class="panel" x="20" y="20" width="470" height="380" rx="12"/>
<text class="h" x="40" y="56">Action&lt;…&gt;：做事，不回傳</text>
<text class="xs" x="40" y="80">角括號裡全部都是「參數」的型別</text>
<rect class="in" x="40" y="104" width="110" height="44" rx="8"/><text class="code" x="95" y="131" text-anchor="middle">string name</text>
<path class="arr" d="M152,126 H192" marker-end="url(#am)"/>
<rect class="fn" x="195" y="96" width="130" height="60" rx="10"/><text class="b t-fn" x="260" y="122" text-anchor="middle">方法</text><text class="xs" x="260" y="141" text-anchor="middle">做一些事</text>
<path class="arr" d="M327,126 H367" marker-end="url(#am)"/>
<rect class="none" x="370" y="104" width="100" height="44" rx="8"/><text class="xs" x="420" y="131" text-anchor="middle">沒有回傳值</text>
<text class="codel" x="40" y="188">Action&lt;string&gt;  = void 方法(string name)</text>
<text class="codem" x="40" y="232">Action              → () =&gt; Console.WriteLine("Hi")</text>
<text class="codem" x="40" y="258">Action&lt;string&gt;      → name =&gt; Console.WriteLine(name)</text>
<text class="codem" x="40" y="284">Action&lt;string, int&gt; → (name, age) =&gt; …</text>
<text class="xs" x="40" y="332">→ 表示「對應到長這樣的 lambda」</text>
<text class="xs" x="40" y="352">lambda 做完事就結束，不交回任何值</text>

<!-- Func -->
<rect class="panel" x="510" y="20" width="470" height="380" rx="12"/>
<text class="h" x="530" y="56">Func&lt;…, TResult&gt;：算出一個值</text>
<text class="xs" x="530" y="80"><tspan style="font-weight:700">最後一個</tspan>型別是「回傳值」，前面的是參數</text>
<!-- 例 1：Func<int, int, int> -->
<rect class="in" x="530" y="100" width="80" height="26" rx="6"/><text class="code" x="570" y="118" text-anchor="middle">int a</text>
<rect class="in" x="530" y="132" width="80" height="26" rx="6"/><text class="code" x="570" y="150" text-anchor="middle">int b</text>
<path class="arr" d="M612,129 H672" marker-end="url(#am)"/>
<rect class="fn" x="675" y="98" width="130" height="60" rx="10"/><text class="b t-fn" x="740" y="124" text-anchor="middle">方法</text><text class="xs" x="740" y="143" text-anchor="middle">a + b</text>
<path class="arr" d="M807,129 H847" marker-end="url(#am)"/>
<rect class="out" x="850" y="107" width="110" height="44" rx="8"/><text class="code" x="905" y="134" text-anchor="middle">int</text>
<text class="codel" x="530" y="188">Func&lt;int, int, int&gt;  = int 方法(int a, int b)</text>
<!-- 例 2：Func<Post, bool> -->
<rect class="in" x="530" y="218" width="80" height="26" rx="6"/><text class="code" x="570" y="236" text-anchor="middle">Post p</text>
<path class="arr" d="M612,231 H672" marker-end="url(#am)"/>
<rect class="fn" x="675" y="204" width="130" height="54" rx="10"/><text class="b t-fn" x="740" y="227" text-anchor="middle">方法</text><text class="xs" x="740" y="246" text-anchor="middle">p.Title.Length &gt; 5</text>
<path class="arr" d="M807,231 H847" marker-end="url(#am)"/>
<rect class="out" x="850" y="209" width="110" height="44" rx="8"/><text class="code" x="905" y="236" text-anchor="middle">bool</text>
<text class="codel" x="530" y="290">Func&lt;Post, bool&gt;  = bool 方法(Post p)</text>
<text class="xs" x="530" y="332">回傳型別看 lambda 算出什麼：Length 是 int，但「&gt; 5」是比較，結果是 bool</text>
<text class="codem" x="530" y="358">沒有參數也可以：Func&lt;int&gt; → () =&gt; 42</text>
</svg>
