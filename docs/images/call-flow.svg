<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 834" width="1000" height="834" role="img" aria-label="BlogDbContext 從建立到送進 Controller 的流程，每一步對應的程式碼：程式啟動時 Program.cs 的 AddDbContext 只登記做法並檢查建構子；Build 和 Run 之後一個 DbContext 都沒有；請求進來要建立 PostsController 時，EF Core 才準備空白設定單、交給 lambda 填、變成 options、呼叫 BlogDbContext 建構子、交給 base，再交回 Controller 的 _db；請求結束就丟掉">
<style>
  svg {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --soft: #f6f8fa;
    --s1: #3b6fd8; --s1-s: #e7f0ff; --s2: #16a34a; --s2-s: #effcf3; --s3: #bc4c00; --s3-s: #fff4e5; --s4: #7c3aed; --s4-s: #f5f0ff;
    --code-bg: #f6f8fa; --code-b: #1f2328; --file: #0969da;
    font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --soft: #151b23;
      --s1: #6ea8ff; --s1-s: #10213d; --s2: #3fb950; --s2-s: #10221a; --s3: #ffa657; --s3-s: #2a1d0e; --s4: #a78bfa; --s4-s: #1c1530;
      --code-bg: #161b22; --code-b: #9198a1; --file: #6ea8ff;
    }
  }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 13px; }
  .h { font-size: 15px; font-weight: 800; }
  .b { font-weight: 700; }
  .xs { font-size: 11.5px; fill: var(--muted); }
  .file { font-size: 11px; font-weight: 700; fill: var(--file); }
  .code { white-space: pre; font-size: 11.5px; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-variant-ligatures: none; }
  .line { stroke: var(--border); stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
  .c1 { fill: var(--s1); } .c2 { fill: var(--s2); } .c3 { fill: var(--s3); } .c4 { fill: var(--s4); }
  .num { fill: #ffffff; font-weight: 800; font-size: 15px; }
  .p1 { fill: var(--s1-s); stroke: var(--s1); stroke-width: 2; }
  .p2 { fill: var(--s2-s); stroke: var(--s2); stroke-width: 2; }
  .p3 { fill: var(--s3-s); stroke: var(--s3); stroke-width: 2; }
  .p4 { fill: var(--s4-s); stroke: var(--s4); stroke-width: 2; stroke-dasharray: 7 4; }
  .step { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
  .step-hi { fill: var(--bg); stroke: var(--s3); stroke-width: 2.5; }
  .mine { fill: var(--code-bg); stroke: var(--code-b); stroke-width: 1.5; }
  .auto { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .k1 { fill: var(--s1); font-weight: 800; } .k2 { fill: var(--s2); font-weight: 800; }
  .k3 { fill: var(--s3); font-weight: 800; } .k4 { fill: var(--s4); font-weight: 800; }
  .link { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }
</style>
<rect class="bg" x="0" y="0" width="1000" height="834" rx="12"/>

<!-- 圖例 -->
<rect class="mine" x="500" y="12" width="26" height="16" rx="4"/><text class="xs" x="532" y="25">你寫的程式碼（括號是在哪一節教的）</text>
<rect class="auto" x="760" y="12" width="26" height="16" rx="4"/><text class="xs" x="792" y="25">框架自己做，你不用寫</text>

<line class="line" x1="40" y1="74" x2="40" y2="770"/>

<!-- ① 啟動 -->
<circle class="c1" cx="40" cy="68" r="16"/><text class="num" x="35" y="73">1</text>
<rect class="p1" x="72" y="44" width="908" height="112" rx="12"/>
<text class="h" x="90" y="72"><tspan class="k1">程式啟動</tspan>：執行 Program.cs</text>
<text x="90" y="100">📝 登記做法：lambda 先收著，<tspan class="b">不執行</tspan></text>
<text x="90" y="124">🔍 順便檢查建構子：<tspan class="b">只看，不呼叫</tspan></text>
<text class="xs" x="90" y="144">沒有收 options 的建構子，程式一啟動就會報錯</text>
<line class="link" x1="470" y1="100" x2="500" y2="100"/>
<rect class="mine" x="500" y="58" width="464" height="84" rx="8"/>
<text class="file" x="514" y="78">Program.cs（3-5）</text>
<text class="code" x="514" y="102">builder.Services.AddDbContext&lt;BlogDbContext&gt;(options =&gt;</text>
<text class="code" x="514" y="122">    options.UseSqlServer(…));</text>

<!-- ② Build / Run -->
<circle class="c2" cx="40" cy="196" r="16"/><text class="num" x="35" y="201">2</text>
<rect class="p2" x="72" y="172" width="908" height="100" rx="12"/>
<text class="h" x="90" y="200"><tspan class="k2">程式跑起來</tspan>，等請求進來</text>
<text x="90" y="228">這時 BlogDbContext：<tspan class="k2">0 個</tspan></text>
<text class="xs" x="90" y="250">建構子一次都還沒被呼叫過</text>
<line class="link" x1="470" y1="228" x2="500" y2="228"/>
<rect class="mine" x="500" y="186" width="464" height="74" rx="8"/>
<text class="file" x="514" y="206">Program.cs（3-1 專案範本就有）</text>
<text class="code" x="514" y="228">var app = builder.Build();</text>
<text class="code" x="514" y="248">app.Run();          // → Now listening on</text>

<!-- ③ 有人要 -->
<circle class="c3" cx="40" cy="312" r="16"/><text class="num" x="35" y="317">3</text>
<rect class="p3" x="72" y="288" width="908" height="450" rx="12"/>
<text class="h" x="90" y="316"><tspan class="k3">有人要 BlogDbContext</tspan>：這時候才真的建立</text>
<text class="xs" x="90" y="338">由上往下依序發生。除了請求，3-6 的 dotnet ef 指令也會「要」，a～e 一樣</text>

<rect class="step" x="90" y="352" width="380" height="46" rx="8"/>
<text class="b" x="104" y="372">請求進來，要建立 Controller</text>
<text class="xs" x="104" y="390">GET /api/posts → 建立 PostsController，它要 BlogDbContext</text>
<line class="link" x1="470" y1="375" x2="500" y2="375"/>
<rect class="mine" x="500" y="352" width="464" height="46" rx="8"/>
<text class="file" x="514" y="369">Controllers/PostsController.cs（3-7）</text>
<text class="code" x="514" y="389">public PostsController(BlogDbContext db)</text>

<rect class="step" x="90" y="406" width="380" height="46" rx="8"/>
<text class="b" x="104" y="426">a. 準備一張<tspan class="k3">空白設定單</tspan></text>
<text class="xs" x="104" y="444">型別是 DbContextOptionsBuilder，還沒填連線資料</text>
<line class="link" x1="470" y1="429" x2="500" y2="429"/>
<rect class="auto" x="500" y="406" width="464" height="46" rx="8"/>
<text class="xs" x="514" y="423">EF Core 自己做，你不用寫</text>
<text class="code" x="514" y="443" style="fill:var(--muted)">new DbContextOptionsBuilder&lt;BlogDbContext&gt;()</text>

<rect class="step" x="90" y="460" width="380" height="46" rx="8"/>
<text class="b" x="104" y="480">b. 把設定單交給你的 lambda 填</text>
<text class="xs" x="104" y="498">options 就是這張單，在上面寫：用 SQL Server＋連線字串</text>
<line class="link" x1="470" y1="483" x2="500" y2="483"/>
<rect class="mine" x="500" y="460" width="464" height="46" rx="8"/>
<text class="file" x="514" y="477">Program.cs（3-5）</text>
<text class="code" x="514" y="497">options =&gt; options.UseSqlServer(…)</text>

<rect class="step" x="90" y="514" width="380" height="46" rx="8"/>
<text class="b" x="104" y="534">c. 填好的單變成<tspan class="k3">成品</tspan></text>
<text class="xs" x="104" y="552">型別是 DbContextOptions&lt;BlogDbContext&gt;</text>
<line class="link" x1="470" y1="537" x2="500" y2="537"/>
<rect class="auto" x="500" y="514" width="464" height="46" rx="8"/>
<text class="xs" x="514" y="531">EF Core 自己做，你不用寫</text>
<text class="code" x="514" y="551" style="fill:var(--muted)">builder.Options</text>

<rect class="step-hi" x="90" y="568" width="380" height="46" rx="8"/>
<text class="b" x="104" y="588"><tspan class="k3">d. 呼叫你的建構子</tspan></text>
<text class="xs" x="104" y="606">把成品傳進來</text>
<line class="link" x1="470" y1="591" x2="500" y2="591"/>
<rect class="mine" x="500" y="568" width="464" height="46" rx="8"/>
<text class="file" x="514" y="585">Data/BlogDbContext.cs（3-3）</text>
<text class="code" x="514" y="605">public BlogDbContext(DbContextOptions&lt;BlogDbContext&gt; options)</text>

<rect class="step" x="90" y="622" width="380" height="46" rx="8"/>
<text class="b" x="104" y="642">e. 交給父類別 DbContext</text>
<text class="xs" x="104" y="660">EF Core 之後就用這份設定連資料庫</text>
<line class="link" x1="470" y1="645" x2="500" y2="645"/>
<rect class="mine" x="500" y="622" width="464" height="46" rx="8"/>
<text class="file" x="514" y="639">Data/BlogDbContext.cs（3-3）</text>
<text class="code" x="514" y="659">    : base(options)</text>

<rect class="step" x="90" y="676" width="380" height="46" rx="8"/>
<text class="b" x="104" y="696">f. 交回 Controller</text>
<text class="xs" x="104" y="714">之後的 API 方法就能用 _db 查資料</text>
<line class="link" x1="470" y1="699" x2="500" y2="699"/>
<rect class="mine" x="500" y="676" width="464" height="46" rx="8"/>
<text class="file" x="514" y="693">Controllers/PostsController.cs（3-7）</text>
<text class="code" x="514" y="713">_db = db;</text>

<!-- ④ 請求結束 -->
<circle class="c4" cx="40" cy="778" r="16"/><text class="num" x="35" y="783">4</text>
<rect class="p4" x="72" y="754" width="908" height="66" rx="12"/>
<text class="h" x="90" y="780"><tspan class="k4">請求結束</tspan>：這個 BlogDbContext 被丟掉</text>
<text class="xs" x="90" y="804">下一個請求進來，回到 ③ 再建一個新的</text>
<line class="link" x1="470" y1="787" x2="500" y2="787"/>
<rect class="auto" x="500" y="766" width="464" height="42" rx="8"/>
<text class="xs" x="514" y="792">ASP.NET Core 自己做（Dispose），你不用寫</text>
</svg>
