<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="1000" height="592" role="img" aria-label="Cookie 是什麼：上排沒有 cookie 時，瀏覽器每次 GET /me 伺服器都回「不知道你是誰」；下排有 cookie 時，GET /login 的回應帶 Set-Cookie: user=alice，瀏覽器放進 cookie 罐，之後每個請求瀏覽器自動加上 Cookie: user=alice，伺服器回「你是 alice」">
<style>
  svg {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --soft: #f6f8fa;
    --c1: #0969da; --c1-s: #ddf4ff; --c2: #bc4c00; --c2-s: #fff4e5; --ok: #1a7f37; --ok-s: #dcfce7; --no: #cf222e; --no-s: #ffebe9;
    font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --soft: #151b23;
      --c1: #58a6ff; --c1-s: #0c2d4a; --c2: #ffa657; --c2-s: #2a1d0e; --ok: #3fb950; --ok-s: #12261b; --no: #ff7b72; --no-s: #3d1515;
    }
  }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 13px; }
  .t { font-size: 14px; font-weight: 700; }
  .sm { font-size: 11.5px; fill: var(--muted); }
  .code { white-space: pre; font-variant-ligatures: none; font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-size: 11.5px; }
  .box { fill: var(--soft); stroke: var(--border); stroke-width: 1.5; }
  .in { fill: var(--c1-s); stroke: var(--c1); stroke-width: 1.5; }
  .jar { fill: var(--c2-s); stroke: var(--c2); stroke-width: 2; }
  .jar-empty { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .band-no { fill: none; stroke: var(--no); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .band-ok { fill: none; stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .k1 { fill: var(--c1); font-weight: 700; } .k-enc { fill: var(--c2); font-weight: 700; } .k-ok { fill: var(--ok); font-weight: 700; } .k-no { fill: var(--no); font-weight: 700; }
  .arr { fill: none; stroke: var(--muted); stroke-width: 2; }
  .arr-dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
  .arr-enc { fill: none; stroke: var(--c2); stroke-width: 2; }
  .f-muted { fill: var(--muted); } .f-enc { fill: var(--c2); }
</style>
<defs>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="f-muted" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="f-enc" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="592" rx="12"/>

<text class="t" x="500" y="28" text-anchor="middle">Cookie：伺服器發給瀏覽器的一張號碼牌，之後瀏覽器每次請求都自動帶著</text>

<!-- 上排：沒有 cookie -->
<text class="t k-no" x="20" y="62">沒有 cookie：HTTP 每個請求都是獨立的，伺服器認不出同一個人</text>
<rect class="band-no" x="10" y="72" width="980" height="188" rx="10"/>

<rect class="in" x="25" y="100" width="190" height="130" rx="10"/>
<text class="t k1" x="120" y="125" text-anchor="middle">瀏覽器</text>
<text class="sm" x="120" y="150" text-anchor="middle">cookie 罐</text>
<rect class="jar-empty" x="55" y="162" width="130" height="50" rx="6"/>
<text class="sm" x="120" y="192" text-anchor="middle">（空的）</text>

<rect class="box" x="775" y="100" width="200" height="130" rx="10"/>
<text class="t" x="875" y="125" text-anchor="middle">你的 API</text>
<text class="code" x="875" y="152" text-anchor="middle">Request.Cookies["user"]</text>
<text class="sm" x="875" y="172" text-anchor="middle">→ null</text>
<text class="k-no" x="875" y="204" text-anchor="middle">不知道你是誰</text>

<text class="sm" x="493" y="122" text-anchor="middle">① GET /me　（沒有 Cookie header）</text>
<path class="arr" d="M215,128 H772" marker-end="url(#am)"/>
<path class="arr-dash" d="M772,150 H218" marker-end="url(#am)"/>
<text class="sm" x="493" y="166" text-anchor="middle">「沒有 cookie，不知道你是誰」</text>
<text class="sm" x="493" y="186" text-anchor="middle">② 再一次 GET /me　（還是沒有）</text>
<path class="arr" d="M215,192 H772" marker-end="url(#am)"/>
<path class="arr-dash" d="M772,214 H218" marker-end="url(#am)"/>
<text class="sm" x="493" y="230" text-anchor="middle">「沒有 cookie，不知道你是誰」</text>
<text class="sm" x="493" y="252" text-anchor="middle">伺服器眼裡，① 和 ② 是兩個陌生人</text>

<!-- 下排：有 cookie -->
<text class="t k-ok" x="20" y="292">有 cookie：第一次回應時發一張號碼牌，之後瀏覽器每次自動帶回</text>
<rect class="band-ok" x="10" y="302" width="980" height="264" rx="10"/>

<rect class="in" x="25" y="330" width="190" height="222" rx="10"/>
<text class="t k1" x="120" y="355" text-anchor="middle">瀏覽器</text>
<text class="sm" x="120" y="380" text-anchor="middle">cookie 罐</text>
<rect class="jar" x="55" y="392" width="130" height="50" rx="6"/>
<text class="code k-enc" x="120" y="415" text-anchor="middle">user=alice</text>
<text class="sm" x="120" y="433" text-anchor="middle">localhost 專用</text>
<text class="sm" x="120" y="470" text-anchor="middle">之後每個往 localhost 的請求</text>
<text class="sm" x="120" y="488" text-anchor="middle">瀏覽器自動把它放進</text>
<text class="sm" x="120" y="506" text-anchor="middle">Cookie header</text>
<text class="k-ok" x="120" y="534" text-anchor="middle" style="font-size:12px">前端程式沒做任何事</text>

<rect class="box" x="775" y="330" width="200" height="222" rx="10"/>
<text class="t" x="875" y="355" text-anchor="middle">你的 API</text>
<text class="sm" x="875" y="380" text-anchor="middle">/login：</text>
<text class="code" x="875" y="398" text-anchor="middle">Response.Cookies</text>
<text class="code" x="875" y="414" text-anchor="middle">.Append("user", "alice")</text>
<text class="sm" x="875" y="446" text-anchor="middle">/me：</text>
<text class="code" x="875" y="464" text-anchor="middle">Request.Cookies["user"]</text>
<text class="sm" x="875" y="484" text-anchor="middle">→ "alice"</text>
<text class="k-ok" x="875" y="520" text-anchor="middle">認出你了</text>

<text class="sm" x="493" y="346" text-anchor="middle">① GET /login</text>
<path class="arr" d="M215,352 H772" marker-end="url(#am)"/>
<path class="arr-dash" d="M772,376 H218" marker-end="url(#am)"/>
<text class="code k-enc" x="493" y="394" text-anchor="middle">② Set-Cookie: user=alice; max-age=1800; httponly</text>
<text class="sm" x="493" y="410" text-anchor="middle">回應的 header 裡多一行，瀏覽器看到就放進罐子</text>
<path class="arr-enc" d="M300,404 C260,404 240,417 190,417" marker-end="url(#ae)"/>

<text class="sm" x="493" y="446" text-anchor="middle">③ GET /me　<tspan class="code k-ok">Cookie: user=alice</tspan>　← 瀏覽器自動加的</text>
<path class="arr" d="M215,452 H772" marker-end="url(#am)"/>
<path class="arr-dash" d="M772,476 H218" marker-end="url(#am)"/>
<text class="sm" x="493" y="492" text-anchor="middle">④ 「你是 alice」</text>
<text class="sm" x="493" y="512" text-anchor="middle">⑤ 之後每一次請求都帶 <tspan class="code k-ok">Cookie: user=alice</tspan></text>
<path class="arr" d="M215,518 H772" marker-end="url(#am)"/>
<path class="arr-dash" d="M772,540 H218" marker-end="url(#am)"/>
<text class="sm" x="493" y="556" text-anchor="middle">⑥ 「你是 alice」</text>

<text class="sm" x="500" y="582" text-anchor="middle">號碼牌一直有效，直到 max-age 到期、瀏覽器關閉（沒設期限時）、或伺服器叫它刪掉</text>
</svg>
